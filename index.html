<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2E3B26"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-180.png"><title>日田 · 壁外调查记录 2027</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"><style id="css">
:root{
  --night:#1B1914; --bark:#26231C; --stone:#6E6A60; --stone-d:#4A4740; --mortar:#34312A;
  --paper:#D9CBA8; --paper-d:#C7B68E; --ink:#2A2419; --ink-soft:#5A4E3A;
  --green:#2E3B26; --green-l:#4F6440; --blood:#8E1B14; --brass:#B48A3A;
  --text:#E8E1CF; --text-soft:#B3A98F; --line:#3E3A31;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --night:#E4DDCB; --bark:#D6CDB6; --text:#231F17; --text-soft:#5E5543; --line:#B8AD94;
    --mortar:#57534A; --stone:#8A857A; --stone-d:#6B675D;
  }
}
:root[data-theme="light"]{
  --night:#E4DDCB; --bark:#D6CDB6; --text:#231F17; --text-soft:#5E5543; --line:#B8AD94;
  --mortar:#57534A; --stone:#8A857A; --stone-d:#6B675D;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--night);color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:1.7}
a{color:inherit}
button,a.btn{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
img{max-width:100%;display:block}

/* ===== hero: the wall ===== */
.wall{position:relative;min-height:88vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:60px 6vw 48px;color:#EFE8D6;
  background:
    radial-gradient(ellipse 60% 38% at 70% 18%,rgba(142,27,20,.55),transparent 70%),
    radial-gradient(ellipse 90% 30% at 50% 0%,rgba(200,190,170,.25),transparent 70%),
    linear-gradient(180deg,#3B1512 0%,#2A221B 34%,transparent 34%),
    #4A4740;}
.bricks{position:absolute;left:0;right:0;top:34%;bottom:0;
  background-color:#5E5A51;
  background-image:
    linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55)),
    repeating-linear-gradient(0deg,#34312A 0 3px,transparent 3px 58px),
    repeating-linear-gradient(90deg,#34312A 0 3px,transparent 3px 116px);}
.bricks::after{content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 58px,#34312A 58px 61px,transparent 61px 116px);
  -webkit-mask:repeating-linear-gradient(0deg,#000 0 58px,transparent 58px 116px);mask:repeating-linear-gradient(0deg,#000 0 58px,transparent 58px 116px);}
/* the breach */
.breach{position:absolute;top:34%;left:58%;width:min(34vw,300px);height:46%;transform:translateX(-50%);
  background:linear-gradient(180deg,#8E1B14 0%,#3B1512 60%,#1B1914 100%);
  clip-path:polygon(18% 0,82% 0,86% 12%,96% 20%,90% 36%,100% 52%,92% 70%,98% 100%,4% 100%,10% 76%,0 58%,8% 40%,2% 24%,12% 12%);
  box-shadow:inset 0 0 40px #000;}
.steam{position:absolute;left:50%;top:10%;width:70vw;height:50%;transform:translateX(-40%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(230,220,200,.22),transparent);filter:blur(8px);animation:steam 9s ease-in-out infinite alternate}
@keyframes steam{from{transform:translateX(-44%) scale(1)}to{transform:translateX(-36%) scale(1.12)}}
.wall .inner{position:relative;z-index:2;max-width:900px}
.wall .unit{font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;color:var(--brass);letter-spacing:.2em;margin:0 0 6px}
.wall h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;line-height:.86;
  font-size:clamp(96px,24vw,280px);color:#F2EBDA;
  text-shadow:0 2px 0 #000,0 0 30px rgba(0,0,0,.6)}
.wall h1 span{display:block;font-size:.26em;line-height:1.2;margin-top:.2em;color:#E3D7BA;letter-spacing:.08em}
.wall p.sub{margin:18px 0 0;max-width:30em;font-size:clamp(16px,2.2vw,20px);color:#DCD1B6}
.wall .meta{margin-top:12px;font-size:14px;color:#BFB294}

/* ===== sticky status ===== */
.status{position:sticky;top:0;z-index:10;background:var(--green);color:#EFE8D6;
  padding:10px 20px;display:flex;align-items:center;gap:14px;font-size:14px;
  border-bottom:3px solid var(--brass)}
.status b{font-family:"Noto Serif SC",serif;font-size:16px}
.gauge{flex:1;height:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.gauge i{display:block;height:100%;width:0;background:var(--brass);transition:width .4s}
.status nav{display:flex;gap:12px}
.status nav a{text-decoration:none;color:#D9CBA8;font-size:13px}


main{max-width:960px;margin:0 auto;padding:0 18px 80px}
section{margin-top:72px}
.shead{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:22px}
.shead h2{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.2}
.shead small{color:var(--text-soft);font-size:14px}
.note{color:var(--text-soft);max-width:44em;margin:0 0 18px}
.warn{color:#E6B7A6}

/* ===== order of march (itinerary) ===== */
.march{list-style:none;margin:0;padding:0;counter-reset:d}
.march>li{display:grid;grid-template-columns:78px 1fr;gap:0 18px;padding:18px 0;border-bottom:1px solid var(--line)}
.march .day{font-family:"Noto Serif SC",serif;font-weight:900;font-size:30px;line-height:1;color:var(--brass)}
.march .day small{display:block;font-family:"Noto Sans SC",sans-serif;font-weight:500;font-size:13px;color:var(--text-soft);margin-top:6px}
.march h3{margin:0 0 6px;font-family:"Noto Serif SC",serif;font-size:19px}
.march ul{margin:0;padding:0;list-style:none}
.march ul li{padding:3px 0 3px 70px;position:relative}
.march ul li em{position:absolute;left:0;font-style:normal;color:var(--text-soft);font-size:14px;top:4px}

/* ===== spot dossiers ===== */
.area{font-family:"Noto Serif SC",serif;font-weight:700;font-size:22px;margin:40px 0 14px;color:var(--text)}
.area small{font-family:"Noto Sans SC",sans-serif;font-weight:400;font-size:14px;color:var(--text-soft);margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.dossier{position:relative;background:var(--paper);color:var(--ink);
  background-image:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%),
    radial-gradient(circle at 90% 110%,rgba(120,90,40,.25),transparent 50%);
  border:1px solid #9C8B64;box-shadow:0 6px 0 -2px #0006, 0 1px 0 #fff4 inset;
  display:flex;flex-direction:column}
.dossier .file{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;
  border-bottom:1px dashed #8C7B55;font-size:12px;color:var(--ink-soft)}
.dossier .file b{font-family:"Noto Serif SC",serif;color:var(--green)}
.photo{position:relative;aspect-ratio:4/3;margin:12px 12px 0;background:#3a352b;overflow:hidden;border:1px solid #6b5d40}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.ref img{filter:grayscale(1) sepia(.35) contrast(1.05) brightness(.85)}
.photo .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#B9AC8C;font-size:13px;text-align:center;padding:16px;
  background:repeating-linear-gradient(135deg,#3a352b 0 10px,#342f26 10px 20px)}
.photo .empty strong{font-family:"Noto Serif SC",serif;font-size:17px;color:#D8CBA9}
.photo .tag{position:absolute;left:8px;bottom:8px;background:rgba(27,25,20,.8);color:#E8E1CF;font-size:12px;padding:2px 8px}
.stamp{position:absolute;right:10px;top:10px;transform:rotate(-9deg);
  border:3px solid var(--blood);color:var(--blood);background:rgba(217,203,168,.85);
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:20px;padding:2px 10px;line-height:1.3;
  box-shadow:0 0 0 2px rgba(217,203,168,.85)}
.stamp small{display:block;font-family:"Noto Sans SC",sans-serif;font-weight:700;font-size:10px;text-align:center}
.body{padding:12px 14px 4px;flex:1}
.body h4{margin:0 0 4px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;line-height:1.35}
.body p{margin:0;font-size:14.5px;color:#3E3524;line-height:1.65}
.body .tel{font-size:13px;color:var(--ink-soft);margin-top:6px}
.flag{display:inline-block;font-family:"Noto Sans SC",sans-serif;font-size:11px;font-weight:700;color:var(--blood);
  border:1px solid var(--blood);padding:0 5px;margin-left:6px;vertical-align:3px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 12px 0}
.nav a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-decoration:none;font-size:13.5px;font-weight:700;
  color:#EFE8D6;background:var(--green);border:1px solid #1d2618}
.nav a.waze{background:#2C4A5A}
.nav a.off{background:transparent;color:var(--ink);border-color:#8C7B55}
.acts{display:flex;gap:6px;padding:8px 12px 12px}
.acts button{flex:1;min-height:42px;cursor:pointer;border:2px solid var(--blood);background:var(--blood);color:#F6EEDB;font-weight:700;font-size:14px}
.acts button.sec{background:transparent;color:var(--ink);border-color:#8C7B55;font-weight:500;flex:0 0 auto;padding:0 12px}
.acts button:disabled{opacity:.55;cursor:wait}
.ginfo{color:#6A4A1E}
.dossier .err{margin:0 12px 10px;font-size:13px;color:var(--blood)}
.hidden{display:none!important}

/* ===== supply table ===== */
.tbl{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:11px 12px;border-bottom:1px solid var(--line)}
th{width:8.5em;color:var(--brass);font-family:"Noto Serif SC",serif;font-weight:700}
.bulletin{border-left:4px solid var(--blood);background:var(--bark);padding:14px 18px;margin-top:26px}
.bulletin p{margin:6px 0}
footer{max-width:960px;margin:0 auto;padding:0 18px 60px;color:var(--text-soft);font-size:13px}
.sysmsg{max-width:960px;margin:14px auto 0;padding:10px 18px;font-size:14px;color:#E6B7A6}
@media(max-width:560px){
  .march>li{grid-template-columns:60px 1fr;gap:0 12px}
  .march .day{font-size:24px}
  .march ul li{padding-left:0}
  .march ul li em{position:static;display:block;top:0}
  .wall{min-height:74vh}
}
@media(prefers-reduced-motion:reduce){.steam{animation:none}.gauge i{transition:none}}

/* galleries */
.gal{margin:12px 12px 0}
.gal .lead{position:relative;aspect-ratio:4/3;background:#3a352b;overflow:hidden;border:1px solid #6b5d40;cursor:zoom-in}
.gal .lead img{width:100%;height:100%;object-fit:cover}
.gal.ref .lead img{filter:sepia(.3) contrast(1.05)}
.thumbs{display:flex;gap:5px;margin-top:5px;overflow-x:auto}
.thumbs button{flex:0 0 auto;width:54px;height:42px;padding:0;border:1px solid #6b5d40;background:#3a352b;cursor:zoom-in}
.thumbs img{width:100%;height:100%;object-fit:cover}
.glabel{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin:10px 12px 0}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:5px 12px 0}
.shots button{aspect-ratio:1;padding:0;border:1px solid #6b5d40;background:#3a352b;cursor:zoom-in}
.shots img{width:100%;height:100%;object-fit:cover}
.shots .none{grid-column:1/-1;font-size:13px;color:var(--ink-soft);padding:8px 0;border-top:1px dashed #8C7B55}
.saving{position:fixed;inset:0;z-index:50;background:rgba(15,14,11,.82);display:flex;align-items:center;justify-content:center;
  color:#EFE8D6;font-family:"Noto Serif SC",serif;font-size:22px;font-weight:900}
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,9,7,.94);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lb .top{display:flex;justify-content:space-between;align-items:center;color:#D9CBA8;font-size:14px;gap:10px}
.lb .top button{background:none;border:1px solid #6b5d40;color:#EFE8D6;min-height:40px;padding:0 14px;cursor:pointer;font:inherit}
.lb .top .del{border-color:var(--blood);color:#F2B8AA}
.lb figure{flex:1;margin:10px 0;display:flex;align-items:center;justify-content:center;min-height:0}
.lb figure img{max-width:100%;max-height:100%;object-fit:contain}
.lb .bot{display:flex;justify-content:space-between}
.lb .bot button{background:var(--green);color:#EFE8D6;border:none;min-height:46px;min-width:96px;font:inherit;font-weight:700;cursor:pointer}
.lb .bot button:disabled{opacity:.3}

.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:56px 0 6px;padding-top:10px;border-top:3px solid var(--brass)}
.dayhead h3{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4vw,32px)}
.dayhead .dd{font-family:"Noto Serif SC",serif;font-weight:900;color:var(--brass);font-size:clamp(24px,4vw,32px)}
.dayhead small{color:var(--text-soft);font-size:14px}
.daytools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.daytools a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;text-decoration:none;font-size:14px;font-weight:700;color:#EFE8D6;background:var(--green);border:1px solid #1d2618}
.daytools span{color:var(--text-soft);font-size:14px;align-self:center}
.route{max-width:560px}
.leg{position:relative;margin:0 0 0 28px;padding:14px 0 14px 26px;border-left:3px dashed var(--brass)}
.leg .lg{font-size:14.5px;color:var(--text)}
.leg .lg b{font-family:"Noto Serif SC",serif;color:var(--brass);font-size:16px}
.leg .lg small{display:block;color:var(--text-soft);font-size:12.5px}
.leg .la{display:flex;gap:8px;margin-top:6px}
.leg .la a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;font-size:13px;font-weight:700;text-decoration:none;color:#EFE8D6;background:var(--green)}
.leg .la a.waze{background:#2C4A5A}
.time{display:inline-block;background:var(--green);color:#EFE8D6;font-size:12px;font-weight:700;padding:1px 8px;margin-right:6px}
.util{background:var(--bark);border:1px solid var(--line);padding:12px 14px;color:var(--text)}
.util h4{margin:0 0 2px;font-family:"Noto Serif SC",serif;font-size:17px}
.util p{margin:0;font-size:14px;color:var(--text-soft)}
.util .nav{padding:10px 0 0}
.anytime{max-width:560px;margin-top:10px}
.anytime .dossier{margin-bottom:18px}
/* ===== iPhone layout ===== */
html{-webkit-text-size-adjust:100%}
a,button{-webkit-tap-highlight-color:rgba(180,138,58,.25);touch-action:manipulation}
.status{flex-wrap:wrap;padding:8px 14px;gap:6px 12px}
.status nav{display:flex;gap:6px;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.status nav::-webkit-scrollbar{display:none}
.status nav a{flex:0 0 auto;min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid rgba(217,203,168,.4);font-size:14px}
main{padding:0 12px 60px}
.route,.anytime{max-width:none}
.body h4{font-size:20px}
.addr,.telk{display:flex;align-items:center;min-height:40px;font-size:14.5px;color:#3E3524;text-decoration:none;border-top:1px dotted #9C8B64}
.addr{margin-top:8px}
.next{margin:10px 12px 0;padding:10px 12px;background:#2E3B26;color:#EFE8D6}
.nx-t{display:flex;gap:8px;align-items:baseline;font-size:13px;color:#C9BD9C}
.nx-t b{font-family:"Noto Serif SC",serif;font-size:17px;color:#EFE8D6}
.nx-m{font-size:13.5px;color:#D9CBA8;margin-top:2px}
.nx-b{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.nx-b a{display:flex;align-items:center;justify-content:center;min-height:48px;font-weight:700;font-size:15px;text-decoration:none;color:#1B1914;background:var(--brass)}
.nx-b a.waze{background:#8FC7E0}
.nx-b.start{margin:4px 0 14px}
.util .next{margin:10px 0 0}
.util .addr{color:var(--text-soft);border-top-color:var(--line)}
.nav{padding:8px 12px 0}
.nav a{min-height:44px}
.acts button{min-height:50px;font-size:15px}
.leg{margin-left:22px;padding:10px 0 10px 18px}
.leg .lg{font-size:13.5px}
.daytools a{min-height:44px}
.lb .top button,.lb .bot button{min-height:48px}
@media(max-width:560px){
  .wall{min-height:62vh;padding:40px 18px 28px}
  .wall h1{font-size:30vw}
  .shead h2{font-size:28px}
  .dayhead{margin-top:40px}
  .shots{grid-template-columns:repeat(3,1fr)}
}
.status nav a.on{background:var(--brass);color:#1B1914;border-color:var(--brass);font-weight:700}
.curday{font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;color:#E8C877}
.curday:empty{display:none}
.status{position:sticky;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 26px)!important;padding-bottom:10px!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
.nx-b.go{margin:10px 12px 0}
.util .nx-b.go{margin:10px 0 0}
.leg .lgn{font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;color:var(--text);line-height:1.4}
.leg .lgn i{font-style:normal;color:var(--brass)}
.leg .lgbtn{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;padding:0 16px;font-size:14px;font-weight:700;text-decoration:none;color:#EFE8D6;background:var(--green);border:1px solid var(--brass)}
.apple{display:block;margin:6px 12px 0;font-size:13px;color:var(--ink-soft);text-decoration:underline;min-height:32px;line-height:32px}
.util .apple{margin:6px 0 0;color:var(--text-soft)}
.lgr{display:flex;align-items:center;gap:14px;margin-top:8px}
.lgr .lgbtn{margin-top:0}
.lgalt{font-size:13px;color:var(--text-soft);min-height:44px;display:inline-flex;align-items:center}
.iptip{background:#3B1512;border:2px solid var(--blood);color:#F2E3D0;padding:12px 14px;margin:0 0 18px;font-size:14.5px;line-height:1.65}
.iptip b{display:block;font-family:"Noto Serif SC",serif;font-size:17px;color:#FFD9A8;margin-bottom:4px}
</style></head><body><template id="shell">
<header class="wall">
  <div class="steam" aria-hidden="true"></div>
  <div class="bricks" aria-hidden="true"></div>
  <div class="breach" aria-hidden="true"></div>
  <div class="inner">
    <p class="unit">壁外调查记录　第 2027-11 次</p>
    <h1>日田<span>进击的巨人 圣地巡礼</span></h1>
    <p class="sub">谏山创老师的故乡。每到一个地点，上传现场照片完成调查。</p>
    <p class="meta">2027 年 11 月 18 日 – 23 日　福冈入境　自驾 11/19 – 11/22</p>
  </div>
</header>

<div class="status" role="status">
  <span id="curday" class="curday"></span><b id="count">调查进度 0 / 0</b>
  <div class="gauge" aria-hidden="true"><i id="fill"></i></div>
  <nav id="daynav"></nav>
</div>
<div id="sysmsg" class="sysmsg hidden"></div>

<main>
<section id="route">
  <div class="shead"><h2>行军路线</h2><small>按顺路排好</small></div>
