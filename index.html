<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2E3B26"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png"><title>旅の栞 · 2027 日田 京都 福冈</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet"><style id="css">
:root{
  --night:#1B1914; --bark:#26231C; --stone:#6E6A60; --stone-d:#4A4740; --mortar:#34312A;
  --paper:#D9CBA8; --paper-d:#C7B68E; --ink:#2A2419; --ink-soft:#5A4E3A;
  --green:#2E3B26; --green-l:#4F6440; --blood:#8E1B14; --brass:#B48A3A;
  --text:#E8E1CF; --text-soft:#B3A98F; --line:#3E3A31;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --night:#E4DDCB; --bark:#D6CDB6; --text:#231F17; --text-soft:#5E5543; --line:#B8AD94;
    --mortar:#57534A; --stone:#8A857A; --stone-d:#6B675D;
  }
}
:root[data-theme="light"]{
  --night:#E4DDCB; --bark:#D6CDB6; --text:#231F17; --text-soft:#5E5543; --line:#B8AD94;
  --mortar:#57534A; --stone:#8A857A; --stone-d:#6B675D;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--night);color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:1.7}
a{color:inherit}
button,a.btn{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
img{max-width:100%;display:block}

/* ===== hero: the wall ===== */
.wall{position:relative;min-height:88vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:60px 6vw 48px;color:#EFE8D6;
  background:
    radial-gradient(ellipse 60% 38% at 70% 18%,rgba(142,27,20,.55),transparent 70%),
    radial-gradient(ellipse 90% 30% at 50% 0%,rgba(200,190,170,.25),transparent 70%),
    linear-gradient(180deg,#3B1512 0%,#2A221B 34%,transparent 34%),
    #4A4740;}
.bricks{position:absolute;left:0;right:0;top:34%;bottom:0;
  background-color:#5E5A51;
  background-image:
    linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55)),
    repeating-linear-gradient(0deg,#34312A 0 3px,transparent 3px 58px),
    repeating-linear-gradient(90deg,#34312A 0 3px,transparent 3px 116px);}
.bricks::after{content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 58px,#34312A 58px 61px,transparent 61px 116px);
  -webkit-mask:repeating-linear-gradient(0deg,#000 0 58px,transparent 58px 116px);mask:repeating-linear-gradient(0deg,#000 0 58px,transparent 58px 116px);}
/* the breach */
.breach{position:absolute;top:34%;left:58%;width:min(34vw,300px);height:46%;transform:translateX(-50%);
  background:linear-gradient(180deg,#8E1B14 0%,#3B1512 60%,#1B1914 100%);
  clip-path:polygon(18% 0,82% 0,86% 12%,96% 20%,90% 36%,100% 52%,92% 70%,98% 100%,4% 100%,10% 76%,0 58%,8% 40%,2% 24%,12% 12%);
  box-shadow:inset 0 0 40px #000;}
.steam{position:absolute;left:50%;top:10%;width:70vw;height:50%;transform:translateX(-40%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(230,220,200,.22),transparent);filter:blur(8px);animation:steam 9s ease-in-out infinite alternate}
@keyframes steam{from{transform:translateX(-44%) scale(1)}to{transform:translateX(-36%) scale(1.12)}}
.wall .inner{position:relative;z-index:2;max-width:900px}
.wall .unit{font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;color:var(--brass);letter-spacing:.2em;margin:0 0 6px}
.wall h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;line-height:.86;
  font-size:clamp(96px,24vw,280px);color:#F2EBDA;
  text-shadow:0 2px 0 #000,0 0 30px rgba(0,0,0,.6)}
.wall h1 span{display:block;font-size:.26em;line-height:1.2;margin-top:.2em;color:#E3D7BA;letter-spacing:.08em}
.wall p.sub{margin:18px 0 0;max-width:30em;font-size:clamp(16px,2.2vw,20px);color:#DCD1B6}
.wall .meta{margin-top:12px;font-size:14px;color:#BFB294}

/* ===== sticky status ===== */
.status{position:sticky;top:0;z-index:10;background:var(--green);color:#EFE8D6;
  padding:10px 20px;display:flex;align-items:center;gap:14px;font-size:14px;
  border-bottom:3px solid var(--brass)}
.status b{font-family:"Noto Serif SC",serif;font-size:16px}
.gauge{flex:1;height:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.gauge i{display:block;height:100%;width:0;background:var(--brass);transition:width .4s}
.status nav{display:flex;gap:12px}
.status nav a{text-decoration:none;color:#D9CBA8;font-size:13px}


main{max-width:960px;margin:0 auto;padding:0 18px 80px}
section{margin-top:72px}
.shead{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:22px}
.shead h2{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.2}
.shead small{color:var(--text-soft);font-size:14px}
.note{color:var(--text-soft);max-width:44em;margin:0 0 18px}
.warn{color:#E6B7A6}

/* ===== order of march (itinerary) ===== */
.march{list-style:none;margin:0;padding:0;counter-reset:d}
.march>li{display:grid;grid-template-columns:78px 1fr;gap:0 18px;padding:18px 0;border-bottom:1px solid var(--line)}
.march .day{font-family:"Noto Serif SC",serif;font-weight:900;font-size:30px;line-height:1;color:var(--brass)}
.march .day small{display:block;font-family:"Noto Sans SC",sans-serif;font-weight:500;font-size:13px;color:var(--text-soft);margin-top:6px}
.march h3{margin:0 0 6px;font-family:"Noto Serif SC",serif;font-size:19px}
.march ul{margin:0;padding:0;list-style:none}
.march ul li{padding:3px 0 3px 70px;position:relative}
.march ul li em{position:absolute;left:0;font-style:normal;color:var(--text-soft);font-size:14px;top:4px}

/* ===== spot dossiers ===== */
.area{font-family:"Noto Serif SC",serif;font-weight:700;font-size:22px;margin:40px 0 14px;color:var(--text)}
.area small{font-family:"Noto Sans SC",sans-serif;font-weight:400;font-size:14px;color:var(--text-soft);margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.dossier{position:relative;background:var(--paper);color:var(--ink);
  background-image:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%),
    radial-gradient(circle at 90% 110%,rgba(120,90,40,.25),transparent 50%);
  border:1px solid #9C8B64;box-shadow:0 6px 0 -2px #0006, 0 1px 0 #fff4 inset;
  display:flex;flex-direction:column}
.dossier .file{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;
  border-bottom:1px dashed #8C7B55;font-size:12px;color:var(--ink-soft)}
.dossier .file b{font-family:"Noto Serif SC",serif;color:var(--green)}
.photo{position:relative;aspect-ratio:4/3;margin:12px 12px 0;background:#3a352b;overflow:hidden;border:1px solid #6b5d40}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.ref img{filter:grayscale(1) sepia(.35) contrast(1.05) brightness(.85)}
.photo .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#B9AC8C;font-size:13px;text-align:center;padding:16px;
  background:repeating-linear-gradient(135deg,#3a352b 0 10px,#342f26 10px 20px)}
.photo .empty strong{font-family:"Noto Serif SC",serif;font-size:17px;color:#D8CBA9}
.photo .tag{position:absolute;left:8px;bottom:8px;background:rgba(27,25,20,.8);color:#E8E1CF;font-size:12px;padding:2px 8px}
.stamp{position:absolute;right:10px;top:10px;transform:rotate(-9deg);
  border:3px solid var(--blood);color:var(--blood);background:rgba(217,203,168,.85);
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:20px;padding:2px 10px;line-height:1.3;
  box-shadow:0 0 0 2px rgba(217,203,168,.85)}
.stamp small{display:block;font-family:"Noto Sans SC",sans-serif;font-weight:700;font-size:10px;text-align:center}
.body{padding:12px 14px 4px;flex:1}
.body h4{margin:0 0 4px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;line-height:1.35}
.body p{margin:0;font-size:14.5px;color:#3E3524;line-height:1.65}
.body .tel{font-size:13px;color:var(--ink-soft);margin-top:6px}
.flag{display:inline-block;font-family:"Noto Sans SC",sans-serif;font-size:11px;font-weight:700;color:var(--blood);
  border:1px solid var(--blood);padding:0 5px;margin-left:6px;vertical-align:3px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 12px 0}
.nav a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-decoration:none;font-size:13.5px;font-weight:700;
  color:#EFE8D6;background:var(--green);border:1px solid #1d2618}
.nav a.waze{background:#2C4A5A}
.nav a.off{background:transparent;color:var(--ink);border-color:#8C7B55}
.acts{display:flex;gap:6px;padding:8px 12px 12px}
.acts button{flex:1;min-height:42px;cursor:pointer;border:2px solid var(--blood);background:var(--blood);color:#F6EEDB;font-weight:700;font-size:14px}
.acts button.sec{background:transparent;color:var(--ink);border-color:#8C7B55;font-weight:500;flex:0 0 auto;padding:0 12px}
.acts button:disabled{opacity:.55;cursor:wait}
.ginfo{color:#6A4A1E}
.dossier .err{margin:0 12px 10px;font-size:13px;color:var(--blood)}
.hidden{display:none!important}

/* ===== supply table ===== */
.tbl{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:11px 12px;border-bottom:1px solid var(--line)}
th{width:8.5em;color:var(--brass);font-family:"Noto Serif SC",serif;font-weight:700}
.bulletin{border-left:4px solid var(--blood);background:var(--bark);padding:14px 18px;margin-top:26px}
.bulletin p{margin:6px 0}
footer{max-width:960px;margin:0 auto;padding:0 18px 60px;color:var(--text-soft);font-size:13px}
.sysmsg{max-width:960px;margin:14px auto 0;padding:10px 18px;font-size:14px;color:#E6B7A6}
@media(max-width:560px){
  .march>li{grid-template-columns:60px 1fr;gap:0 12px}
  .march .day{font-size:24px}
  .march ul li{padding-left:0}
  .march ul li em{position:static;display:block;top:0}
  .wall{min-height:74vh}
}
@media(prefers-reduced-motion:reduce){.steam{animation:none}.gauge i{transition:none}}

/* galleries */
.gal{margin:12px 12px 0}
.gal .lead{position:relative;aspect-ratio:4/3;background:#3a352b;overflow:hidden;border:1px solid #6b5d40;cursor:zoom-in}
.gal .lead img{width:100%;height:100%;object-fit:cover}
.gal.ref .lead img{filter:sepia(.3) contrast(1.05)}
.thumbs{display:flex;gap:5px;margin-top:5px;overflow-x:auto}
.thumbs button{flex:0 0 auto;width:54px;height:42px;padding:0;border:1px solid #6b5d40;background:#3a352b;cursor:zoom-in}
.thumbs img{width:100%;height:100%;object-fit:cover}
.glabel{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin:10px 12px 0}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:5px 12px 0}
.shots button{aspect-ratio:1;padding:0;border:1px solid #6b5d40;background:#3a352b;cursor:zoom-in}
.shots img{width:100%;height:100%;object-fit:cover}
.shots .none{grid-column:1/-1;font-size:13px;color:var(--ink-soft);padding:8px 0;border-top:1px dashed #8C7B55}
.saving{position:fixed;inset:0;z-index:50;background:rgba(15,14,11,.82);display:flex;align-items:center;justify-content:center;
  color:#EFE8D6;font-family:"Noto Serif SC",serif;font-size:22px;font-weight:900}
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,9,7,.94);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lb .top{display:flex;justify-content:space-between;align-items:center;color:#D9CBA8;font-size:14px;gap:10px}
.lb .top button{background:none;border:1px solid #6b5d40;color:#EFE8D6;min-height:40px;padding:0 14px;cursor:pointer;font:inherit}
.lb .top .del{border-color:var(--blood);color:#F2B8AA}
.lb figure{flex:1;margin:10px 0;display:flex;align-items:center;justify-content:center;min-height:0}
.lb figure img{max-width:100%;max-height:100%;object-fit:contain}
.lb .bot{display:flex;justify-content:space-between}
.lb .bot button{background:var(--green);color:#EFE8D6;border:none;min-height:46px;min-width:96px;font:inherit;font-weight:700;cursor:pointer}
.lb .bot button:disabled{opacity:.3}

.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:56px 0 6px;padding-top:10px;border-top:3px solid var(--brass)}
.dayhead h3{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4vw,32px)}
.dayhead .dd{font-family:"Noto Serif SC",serif;font-weight:900;color:var(--brass);font-size:clamp(24px,4vw,32px)}
.dayhead small{color:var(--text-soft);font-size:14px}
.daytools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.daytools a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;text-decoration:none;font-size:14px;font-weight:700;color:#EFE8D6;background:var(--green);border:1px solid #1d2618}
.daytools > span{color:var(--text-soft);font-size:14px;align-self:center}
.route{max-width:560px}
.leg{position:relative;margin:0 0 0 28px;padding:14px 0 14px 26px;border-left:3px dashed var(--brass)}
.leg .lg{font-size:14.5px;color:var(--text)}
.leg .lg b{font-family:"Noto Serif SC",serif;color:var(--brass);font-size:16px}
.leg .lg small{display:block;color:var(--text-soft);font-size:12.5px}
.leg .la{display:flex;gap:8px;margin-top:6px}
.leg .la a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;font-size:13px;font-weight:700;text-decoration:none;color:#EFE8D6;background:var(--green)}
.leg .la a.waze{background:#2C4A5A}
.time{display:inline-block;background:var(--green);color:#EFE8D6;font-size:12px;font-weight:700;padding:1px 8px;margin-right:6px}
.util{background:var(--bark);border:1px solid var(--line);padding:12px 14px;color:var(--text)}
.util h4{margin:0 0 2px;font-family:"Noto Serif SC",serif;font-size:17px}
.util p{margin:0;font-size:14px;color:var(--text-soft)}
.util .nav{padding:10px 0 0}
.anytime{max-width:560px;margin-top:10px}
.anytime .dossier{margin-bottom:18px}
/* ===== iPhone layout ===== */
html{-webkit-text-size-adjust:100%}
a,button{-webkit-tap-highlight-color:rgba(180,138,58,.25);touch-action:manipulation}
.status{flex-wrap:wrap;padding:8px 14px;gap:6px 12px}
.status nav{display:flex;gap:6px;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.status nav::-webkit-scrollbar{display:none}
.status nav a{flex:0 0 auto;min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid rgba(217,203,168,.4);font-size:14px}
main{padding:0 12px 60px}
.route,.anytime{max-width:none}
.body h4{font-size:20px}
.addr,.telk{display:flex;align-items:center;min-height:40px;font-size:14.5px;color:#3E3524;text-decoration:none;border-top:1px dotted #9C8B64}
.addr{margin-top:8px}
.next{margin:10px 12px 0;padding:10px 12px;background:#2E3B26;color:#EFE8D6}
.nx-t{display:flex;gap:8px;align-items:baseline;font-size:13px;color:#C9BD9C}
.nx-t b{font-family:"Noto Serif SC",serif;font-size:17px;color:#EFE8D6}
.nx-m{font-size:13.5px;color:#D9CBA8;margin-top:2px}
.nx-b{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.nx-b a{display:flex;align-items:center;justify-content:center;min-height:48px;font-weight:700;font-size:15px;text-decoration:none;color:#1B1914;background:var(--brass)}
.nx-b.start{margin:4px 0 14px}
.util .next{margin:10px 0 0}
.util .addr{color:var(--text-soft);border-top-color:var(--line)}
.nav{padding:8px 12px 0}
.nav a{min-height:44px}
.acts button{min-height:50px;font-size:15px}
.leg{margin-left:22px;padding:10px 0 10px 18px}
.leg .lg{font-size:13.5px}
.daytools a{min-height:44px}
.lb .top button,.lb .bot button{min-height:48px}
@media(max-width:560px){
  .wall{min-height:62vh;padding:40px 18px 28px}
  .wall h1{font-size:30vw}
  .shead h2{font-size:28px}
  .dayhead{margin-top:40px}
  .shots{grid-template-columns:repeat(3,1fr)}
}
.status nav a.on{background:var(--brass);color:#1B1914;border-color:var(--brass);font-weight:700}
.curday{font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;color:#E8C877}
.curday:empty{display:none}
.status{position:sticky;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 26px)!important;padding-bottom:10px!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
.nx-b.go{margin:10px 12px 0}
.util .nx-b.go{margin:10px 0 0}
.leg .lgn{font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;color:var(--text);line-height:1.4}
.leg .lgn i{font-style:normal;color:var(--brass)}
.leg .lgbtn{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;padding:0 16px;font-size:14px;font-weight:700;text-decoration:none;color:#EFE8D6;background:var(--green);border:1px solid var(--brass)}
.apple{display:block;margin:6px 12px 0;font-size:13px;color:var(--ink-soft);text-decoration:underline;min-height:32px;line-height:32px}
.util .apple{margin:6px 0 0;color:var(--text-soft)}
.lgr{display:flex;align-items:center;gap:14px;margin-top:8px}
.lgr .lgbtn{margin-top:0}
.lgalt{font-size:13px;color:var(--text-soft);min-height:44px;display:inline-flex;align-items:center}
.iptip{background:#3B1512;border:2px solid var(--blood);color:#F2E3D0;padding:12px 14px;margin:0 0 18px;font-size:14.5px;line-height:1.65}
.iptip b{display:block;font-family:"Noto Serif SC",serif;font-size:17px;color:#FFD9A8;margin-bottom:4px}
.admin{margin-top:28px;border:1px solid var(--line);background:var(--bark);padding:14px 16px}
.admin h3{margin:0 0 6px;font-family:"Noto Serif SC",serif;font-size:19px}
.admin p{margin:4px 0;font-size:14px;color:var(--text-soft)}
.admin .ast{color:var(--brass);font-weight:700}
.admin input{width:100%;min-height:46px;font-size:16px;padding:0 10px;margin-top:8px;background:var(--night);color:var(--text);border:1px solid var(--line)}
.abtn{display:flex;gap:8px;margin-top:8px}
.abtn button{flex:1;min-height:46px;font:inherit;font-weight:700;border:1px solid var(--brass);background:var(--green);color:#EFE8D6}
.abtn .aclear{background:transparent;color:var(--text)}
.refresh{margin-left:auto;order:2;min-height:36px;padding:0 12px;font:inherit;font-size:13.5px;font-weight:700;color:#1B1914;background:var(--brass);border:none;cursor:pointer}
.refresh:disabled{opacity:.75}
.status #count{order:1}
.status .gauge{order:3;flex-basis:100%}
.status nav{order:4}
/* ===== motion: the wall ===== */
.wall .rubble{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.wall .rubble i{position:absolute;top:34%;width:6px;height:6px;background:#5E5A51;box-shadow:inset -1px -1px 0 #34312A;opacity:0;animation:fall linear infinite}
.wall .rubble i.s{width:3px;height:3px;background:#8A857A}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.95}100%{transform:translate(var(--dx,0px),62vh) rotate(var(--r,360deg));opacity:0}}
.breach{animation:ember 3.6s ease-in-out infinite alternate}

  box-shadow:0 0 0 1px #7A6440,0 0 0 5px #2A2219,0 0 0 6px #B48A3A,0 28px 50px rgba(0,0,0,.7);
  animation:dealt .5s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes dealt{0%{transform:translateY(40px) rotate(-4deg) scale(.96);opacity:0}100%{transform:rotate(-.6deg);opacity:1}}
.nb-card .nb-unit{position:relative;margin:0 0 4px;padding:12px 18px 11px 18px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:13px;letter-spacing:.32em;
  color:#E8D9A8;background:linear-gradient(180deg,#34432B,#202A1A);border-bottom:2px solid #B48A3A;
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.35)}
.nb-card .nb-unit::before,.nb-card .nb-unit::after{content:"";position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#F2D38A,#8C6A26 70%);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.nb-card .nb-unit::before{right:14px}.nb-card .nb-unit::after{right:30px}
.nb-card h3{margin:14px 18px 4px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:28px;line-height:1.2;letter-spacing:.04em;color:#1E1A12}
.nb-card .nb-sub{margin:0 18px 10px;font-size:14px;color:#5A4A30;line-height:1.6}
.nb-card .nb-err{margin:4px 18px 0;min-height:18px;font-size:13px;color:#8E1B14;font-weight:700}
/* wax seal */
.nb-card .seal{position:absolute;right:16px;top:44px;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#C2392C,#8E1B14 55%,#5E0F0A 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 0 0 5px rgba(0,0,0,.12),inset 0 0 0 7px rgba(255,180,160,.18);
  transform:rotate(-14deg);animation:sealin .55s cubic-bezier(.3,1.6,.5,1) .25s both}
.nb-card .seal::before{content:"";position:absolute;inset:12px;border-radius:50%;border:2px solid rgba(255,210,190,.35)}
.nb-card .seal::after{content:attr(data-t);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;color:rgba(255,226,210,.85);text-shadow:0 -1px 0 rgba(0,0,0,.35)}
@keyframes sealin{0%{transform:rotate(-14deg) scale(2.2);opacity:0}60%{transform:rotate(-16deg) scale(.92);opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.nb-card .seal ~ h3,.nb-card .seal ~ .nb-sub{margin-right:90px}
/* enlistment form lines */
.nb-form{margin:6px 18px 0;border-top:1px solid rgba(90,70,40,.45)}
.nb-line{display:flex;align-items:flex-end;gap:12px;min-height:46px;border-bottom:1px solid rgba(90,70,40,.45)}
.nb-line b{flex:0 0 3.2em;padding-bottom:9px;font-family:"Noto Serif SC",serif;font-size:13px;letter-spacing:.2em;color:#6B4A2F}
.nb-line span{padding-bottom:9px;font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;color:#2A2419}
.nb-card .nb-line input{flex:1;min-height:44px;padding:0 2px;margin:0;border:none;border-radius:0;background:transparent;
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:20px;color:#1E1A12;border-bottom:2px solid transparent}
.nb-card .nb-line input:focus{outline:none;border-bottom-color:#8E1B14;background:rgba(255,255,255,.18)}
.nb-card .nb-line input::placeholder{color:rgba(90,70,40,.45);font-weight:700}
/* actions */
.nb-card .nb-row{display:flex;flex-direction:column;gap:6px;margin:14px 18px 0}
.nb-card .nb-row .nb-ok{--trim:#F2D38A;--p1:#9E2219;--p2:#6A130D;position:relative;min-height:54px;border:1px solid rgba(242,211,138,.5);border-radius:2px;
  color:#F6EEDB;font-family:"Noto Serif SC",serif;font-weight:900;font-size:18px;letter-spacing:.3em;text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:linear-gradient(var(--trim),var(--trim)) left top/12px 2px no-repeat,linear-gradient(var(--trim),var(--trim)) left top/2px 12px no-repeat,
    linear-gradient(var(--trim),var(--trim)) right top/12px 2px no-repeat,linear-gradient(var(--trim),var(--trim)) right top/2px 12px no-repeat,
    linear-gradient(var(--trim),var(--trim)) left bottom/12px 2px no-repeat,linear-gradient(var(--trim),var(--trim)) left bottom/2px 12px no-repeat,
    linear-gradient(var(--trim),var(--trim)) right bottom/12px 2px no-repeat,linear-gradient(var(--trim),var(--trim)) right bottom/2px 12px no-repeat,
    linear-gradient(180deg,var(--p1),var(--p2));box-shadow:0 2px 0 rgba(0,0,0,.35)}
.nb-card .nb-row .nb-cancel,.nb-card .nb-row .vclose{min-height:44px;border:none;background:none;color:#5A4A30;font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;letter-spacing:.2em;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
/* vote ledger */
.vsheet .vlist{margin:6px 18px 4px;border-top:2px solid #2A2219}
.vsheet .vli{min-height:54px;gap:14px;border-bottom:1px solid rgba(90,70,40,.45)}
.vsheet .vli::before{content:attr(data-n);flex:0 0 1.6em;font-family:"Noto Serif SC",serif;font-weight:900;font-size:13px;color:#8C7B55}
.vsheet .vli .vn{font-size:17px}
.vsheet .vli .vv{font-family:"Noto Serif SC",serif;font-weight:900;font-size:14px;letter-spacing:.15em;padding:2px 8px;border:2px solid currentColor;transform:rotate(-4deg)}
.vsheet .vli .vv:not(.like):not(.dis){border:none;transform:none;color:#A89A78}
.vsheet .vli .vv.like{color:#2B5A28}.vsheet .vli .vv.dis{color:#8E1B14}
/* wax dots everywhere */
.vd{width:22px;height:22px;border:2px dashed #8C7B55;background:rgba(255,255,255,.15)}
.vd.like{border:none;background:radial-gradient(circle at 36% 32%,#6FA35F,#3E7C3A 55%,#244B21);box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 0 0 3px rgba(0,0,0,.12)}
.vd.dis{border:none;background:radial-gradient(circle at 36% 32%,#C2392C,#8E1B14 55%,#5E0F0A);box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 0 0 3px rgba(0,0,0,.12)}
.vd.mine{box-shadow:0 0 0 2px #E6D9B6,0 0 0 4px #B48A3A,0 1px 2px rgba(0,0,0,.45)}
/* vote choice plates */
.vsheet .vbtn{margin:12px 18px 0;gap:10px}
.vsheet .vbtn button{position:relative;min-height:64px;flex-direction:column;gap:4px;border:1px solid rgba(90,70,40,.6);border-radius:2px;background:rgba(255,255,255,.22);
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;letter-spacing:.2em;color:#2A2419}
.vsheet .vbtn button::before{width:22px;height:22px;border:none}
.vsheet .vbtn .vl::before{background:radial-gradient(circle at 36% 32%,#6FA35F,#3E7C3A 55%,#244B21)}
.vsheet .vbtn .vx::before{background:radial-gradient(circle at 36% 32%,#C2392C,#8E1B14 55%,#5E0F0A)}
.vsheet .vbtn .vl.on{background:linear-gradient(180deg,#3E7C3A,#26511F);color:#F3ECDA;border-color:#B48A3A;box-shadow:inset 0 0 0 2px #B48A3A}
.vsheet .vbtn .vx.on{background:linear-gradient(180deg,#A2241B,#6E140E);color:#F3ECDA;border-color:#B48A3A;box-shadow:inset 0 0 0 2px #B48A3A}
.vsheet .vbtn .on::before{box-shadow:0 0 0 2px #F3ECDA}
@media (prefers-reduced-motion:reduce){.nb-card,.nb-card .seal,.namebox::before{animation:none!important}}
.vsheet .vbtn.vstamps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 18px 2px}
.vsheet .vbtn.vstamps button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 6px 12px;cursor:pointer;
  border:1px dashed rgba(90,70,40,.45);border-radius:2px;background:rgba(255,255,255,.12);transition:background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.vsheet .vbtn.vstamps button::before,.vsheet .vbtn.vstamps button::after{display:none!important}
.vsheet .vbtn.vstamps button:focus-visible{outline:2px solid #8E1B14;outline-offset:2px}

.stp-t{font-size:22px;letter-spacing:.12em;line-height:1.15;padding:3px 6px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.vx .stp-t{font-size:19px;letter-spacing:.06em}
.stp-star{font-size:10px;line-height:1}
.stp-cap{font-family:"Noto Serif SC",serif;font-weight:700;font-size:13.5px;letter-spacing:.12em;color:#6B5A3A}
.vsheet .vbtn.vstamps button:active .stp{opacity:.75;filter:none}
@media (hover:hover){.vsheet .vbtn.vstamps button:hover .stp{opacity:.75;filter:none}}
.vsheet .vbtn.vstamps button.on{background:rgba(255,255,255,.28);border-style:solid;border-color:rgba(90,70,40,.6)}
.vsheet .vbtn.vstamps button.on .stp{opacity:1;filter:none}
.vsheet .vbtn.vstamps .vl.on .stp-cap{color:#2E6B2A}.vsheet .vbtn.vstamps .vx.on .stp-cap{color:#9A1F16}
.vsheet .vbtn.vstamps button.press .stp{animation:stampit .38s cubic-bezier(.3,1.5,.5,1) both}
.vx.press .stp{animation-name:stampit2!important}
@keyframes stampit{0%{transform:rotate(-9deg) scale(1.35) translateY(-10px);opacity:.6;filter:none}55%{transform:rotate(-11deg) scale(.92);opacity:1}100%{transform:rotate(-9deg) scale(1);opacity:1;filter:none}}
@keyframes stampit2{0%{transform:rotate(7deg) scale(1.35) translateY(-10px);opacity:.6;filter:none}55%{transform:rotate(9deg) scale(.92);opacity:1}100%{transform:rotate(7deg) scale(1);opacity:1;filter:none}}
.vsheet .vbtn.vstamps button:disabled{cursor:not-allowed;opacity:.5}
@media (prefers-reduced-motion:reduce){.vsheet .vbtn.vstamps button.press .stp{animation:none}}
.vsheet .vbtn.vstamps .vl.on,.vsheet .vbtn.vstamps .vx.on{background:rgba(255,255,255,.3);color:inherit;box-shadow:inset 0 0 0 1px rgba(90,70,40,.35)}
.vsheet .vbtn.vstamps .vl.on .stp-cap::before,.vsheet .vbtn.vstamps .vx.on .stp-cap::before{content:none}
/* ===== signal flares ===== */
.votes .vrow{gap:10px}
.votes .vlab{display:flex;flex-direction:column;line-height:1.15;font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;color:#3A2F1C;letter-spacing:.08em}
.votes .vlab small{font-family:"Noto Sans SC",sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.02em;color:#7A6A4A}
.votes .vdots{gap:4px;padding:2px 10px 0;min-height:52px;align-items:flex-end;background:linear-gradient(180deg,transparent 60%,rgba(60,45,25,.10));border-bottom:2px solid rgba(90,70,40,.35)}
.votes .vd,.vlist .vd{position:relative;display:inline-block;width:30px;height:48px;border:none!important;border-radius:0;background:none!important;box-shadow:none!important;flex:0 0 auto}
/* cartridge */
.votes .vd::before,.vlist .vd::before{content:"";position:absolute;left:50%;bottom:0;width:10px;height:14px;margin-left:-5px;border-radius:2px 2px 1px 1px;
  border:1.5px dashed #8C7B55;background:rgba(255,255,255,.18);box-sizing:border-box}
.votes .vd.like::before,.votes .vd.dis::before,.vlist .vd.like::before,.vlist .vd.dis::before{border:none;
  background:linear-gradient(90deg,#6B5A3A,#C9A55A 45%,#7A6440);box-shadow:inset 0 3px 0 rgba(0,0,0,.35)}
/* smoke plume */
.votes .vd.like::after,.votes .vd.dis::after,.vlist .vd.like::after,.vlist .vd.dis::after{content:"";position:absolute;left:50%;bottom:12px;width:30px;height:38px;margin-left:-15px;
  background:
    radial-gradient(circle at 50% 22%,var(--sm) 0 7px,transparent 8px),
    radial-gradient(circle at 34% 38%,var(--sm2) 0 6px,transparent 7px),
    radial-gradient(circle at 64% 44%,var(--sm2) 0 6px,transparent 7px),
    radial-gradient(circle at 48% 62%,var(--sm2) 0 5px,transparent 6px),
    linear-gradient(var(--sm2),var(--sm2)) 50% 100%/3px 46% no-repeat;
  filter:blur(.6px);transform-origin:50% 100%;animation:plume 3.2s ease-in-out infinite alternate}
.votes .vd.like,.vlist .vd.like{--sm:#5FA352;--sm2:rgba(72,140,62,.78)}
.votes .vd.dis,.vlist .vd.dis{--sm:#D2463A;--sm2:rgba(178,40,30,.78)}
@keyframes plume{0%{transform:translateX(-1px) scaleY(.96) skewX(-3deg)}100%{transform:translateX(1.5px) scaleY(1.04) skewX(4deg)}}
/* own flare */
.votes .vd.mine::before,.vlist .vd.mine::before{box-shadow:inset 0 3px 0 rgba(0,0,0,.35),0 0 0 2px #E6D9B6,0 0 0 3.5px #B48A3A}
/* list rows: smaller flares */
.vlist .vd{width:26px;height:40px;transform:scale(.9);transform-origin:50% 100%}
/* pencil plate */
.votes .vpen{width:44px;height:44px;border:1px solid rgba(180,138,58,.6);background:linear-gradient(180deg,#2F3B27,#1F271A);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.votes .vpen svg{stroke:#D2AE55}
@media (prefers-reduced-motion:reduce){.votes .vd::after,.vlist .vd::after{animation:none}}
.votes{padding-top:30px}
.votes .vrow{align-items:center}
.votes .vdots{background:none!important;border:none!important;min-height:0;height:44px;padding:0 8px;margin:0;align-items:stretch}
.votes .vd{height:44px}
.votes .vd::before{bottom:15px}
.votes .vd.like::after,.votes .vd.dis::after{bottom:27px}
.votes .vd.like::after,.votes .vd.dis::after,.vlist .vd.like::after,.vlist .vd.dis::after{
  width:28px;height:40px;margin-left:-14px;
  background:
    radial-gradient(ellipse 9px 7px at 50% 18%,var(--sm) 0 85%,transparent 100%),
    radial-gradient(ellipse 7px 6px at 38% 28%,var(--sm2) 0 80%,transparent 100%),
    radial-gradient(ellipse 7px 6px at 62% 28%,var(--sm2) 0 80%,transparent 100%),
    radial-gradient(ellipse 5px 5px at 50% 44%,var(--sm2) 0 80%,transparent 100%),
    linear-gradient(90deg,transparent calc(50% - 2.5px),var(--sm2) calc(50% - 2.5px),var(--sm2) calc(50% + 2.5px),transparent calc(50% + 2.5px)) 50% 48%/100% 26% no-repeat,
    linear-gradient(90deg,transparent calc(50% - 1.5px),var(--sm2) calc(50% - 1.5px),var(--sm2) calc(50% + 1.5px),transparent calc(50% + 1.5px)) 50% 100%/100% 34% no-repeat;
  -webkit-mask:linear-gradient(0deg,#000 0,#000 100%);
  transform-origin:50% 100%;animation:plume2 3.4s ease-in-out infinite alternate}
@keyframes plume2{0%{transform:skewX(0deg) scaleY(.97)}100%{transform:skewX(-6deg) scaleY(1.03)}}
.shots .more{position:relative;overflow:hidden}
.shots .more img{filter:blur(2px) brightness(.45) sepia(.3);transform:scale(1.1)}
.shots .more .more-l{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#F3ECDA;
  font-family:"Noto Serif SC",serif;box-shadow:inset 0 0 0 2px rgba(210,174,85,.7)}
.shots .more .more-l b{font-size:24px;font-weight:900;line-height:1}
.shots .more .more-l span{font-size:13px;font-weight:700;letter-spacing:.2em}
.gal-ov{position:fixed;inset:0;z-index:38;display:flex;flex-direction:column;background:#15130F;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 5px);animation:rise .25s ease-out}
.gal-hd{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;background:linear-gradient(180deg,#34432B,#202A1A);border-bottom:2px solid #B48A3A}
.gal-ht{flex:1;min-width:0}
.gal-unit{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:12px;letter-spacing:.3em;color:#D2AE55}
.gal-ht h3{display:inline;margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;color:#EFE8D6}
.gal-n{margin-left:10px;font-size:13px;color:#C9BD9C}
.gal-x{flex:0 0 auto;min-height:44px;padding:0 16px;font:inherit;font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;letter-spacing:.2em;color:#EFE8D6;
  background:rgba(0,0,0,.3);border:1px solid rgba(180,138,58,.7);border-radius:2px;cursor:pointer}
.gal-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;
  padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 16px);align-content:start}
@media(max-width:560px){.gal-grid{grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 16px)}}

/* ===== K-ON day theme: after-school notebook ===== */
.kon{--k-pink:#FF8FB1;--k-pink2:#FF6F9C;--k-mint:#7ED7C1;--k-sky:#7CC3F0;--k-yel:#FFD66B;--k-ink:#4A3B4F;--k-paper:#FFFBF4;--k-line:#DCEBF7;
  position:relative;margin:48px -6px 0;padding:6px 14px 30px 26px;border-radius:22px;color:var(--k-ink);
  background:
    linear-gradient(90deg,transparent 15px,rgba(255,143,177,.55) 15px,rgba(255,143,177,.55) 17px,transparent 17px),
    repeating-linear-gradient(180deg,var(--k-paper) 0 31px,var(--k-line) 31px 32px);
  box-shadow:0 0 0 3px #FFE1EA,0 18px 40px rgba(0,0,0,.35)}
.kon::before{content:"";position:absolute;left:-2px;top:28px;bottom:28px;width:10px;
  background:radial-gradient(circle at 5px 8px,#1B1914 0 4px,transparent 4.5px) 0 0/10px 34px repeat-y}
.kon .dayhead{border-top:none;margin-top:18px;padding-top:4px;align-items:center}
.kon .dayhead .dd{display:inline-block;padding:4px 14px 5px;border-radius:999px;font-size:clamp(18px,3.4vw,24px);color:#fff;background:var(--k-pink);transform:rotate(-3deg);box-shadow:0 3px 0 var(--k-pink2)}
.kon .dayhead h3{color:var(--k-ink);font-family:"Noto Sans SC",sans-serif;font-weight:900;letter-spacing:.02em}
.kon .dayhead small{color:#8A7A8F}
.kon .k-notes{position:absolute;right:18px;top:14px;display:flex;gap:10px;pointer-events:none}
.kon .k-notes span{font-size:24px;line-height:1;animation:knote 2.6s ease-in-out infinite}
.kon .k-notes span:nth-child(1){color:var(--k-pink)}.kon .k-notes span:nth-child(2){color:var(--k-sky);animation-delay:.4s}.kon .k-notes span:nth-child(3){color:var(--k-mint);animation-delay:.8s}.kon .k-notes span:nth-child(4){color:var(--k-yel);animation-delay:1.2s}
@keyframes knote{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(6deg)}}
.kon .k-tape{display:flex;gap:6px;margin:4px 0 12px}
.kon .k-tape i{height:8px;flex:1;border-radius:4px}
.kon .k-tape i:nth-child(1){background:var(--k-pink)}.kon .k-tape i:nth-child(2){background:var(--k-yel)}.kon .k-tape i:nth-child(3){background:var(--k-mint)}.kon .k-tape i:nth-child(4){background:var(--k-sky)}
/* cards */
.kon .dossier,.kon .util{position:relative;border-radius:16px;border:2px solid #FFD3E0;background:#fff;color:var(--k-ink);box-shadow:0 5px 0 #FFD3E0;overflow:visible}
.kon .dossier::before,.kon .util::before{content:"";position:absolute;left:50%;top:-11px;width:86px;height:22px;transform:translateX(-50%) rotate(-3deg);border-radius:3px;opacity:.9;
  background:repeating-linear-gradient(45deg,var(--k-yel) 0 8px,#FFE9A6 8px 16px)}
.kon .dossier:nth-of-type(3n+2)::before{background:repeating-linear-gradient(45deg,var(--k-mint) 0 8px,#BDEFE2 8px 16px);transform:translateX(-50%) rotate(2deg)}
.kon .dossier:nth-of-type(3n)::before{background:repeating-linear-gradient(45deg,var(--k-sky) 0 8px,#C4E5F9 8px 16px);transform:translateX(-50%) rotate(-1deg)}
.kon .dossier .file{border-bottom:2px dotted #FFD3E0;color:#B08AA0}
.kon .dossier .file b{color:var(--k-pink2)}
.kon .body h4,.kon .util h4{color:var(--k-ink);font-family:"Noto Sans SC",sans-serif;font-weight:900}
.kon .body p,.kon .util p{color:#6E5F72}
.kon .time{background:var(--k-sky);color:#fff;border-radius:999px;padding:1px 10px}
.kon .flag{color:var(--k-pink2);border-color:var(--k-pink2);border-radius:999px;padding:0 7px}
.kon .addr,.kon .telk{color:#5E5063;border-top-color:#F3D9E2}
.kon .tel.ginfo,.kon .ginfo{color:#9A7C8C}
.kon .glabel{color:#9A8A9E}
.kon .shots .none{color:#9A8A9E;border-top-color:#F3D9E2}
.kon .gal .lead{border-radius:12px;border:none;background:#FFF0F5}
.kon .gal .lead .empty{background:repeating-linear-gradient(135deg,#FFF3F7 0 12px,#FFE8EF 12px 24px)!important;color:#C68AA2!important;border-radius:12px}
.kon .gal .lead .empty strong{color:var(--k-pink2)!important}

  <p class="note warn">日期还没定，排日期时注意：第 2 天（大山）不能是周三或周末，博物馆本馆、想夫恋、CLOVER 周三休，大山公民馆周末休；第 3 天不能是周一，たかむら、SLOWcafe、Link 周一休；第 5 天（轻音少女）不能是周一，豊郷小学校周一休，JEUGIA 周四休、レトロビーバー周三休。京阿尼只拍外观，周末也可以。</p>
  <div class="iptip"><b>用 Safari 打开，加入主画面</b>在「照片管理」设定了 GitHub 金钥的手机可以上传和删除照片，上传后所有人打开这个网址都看得到，每 3 分钟自动更新，也可以按「↻ 更新照片」马上刷新。建议用 Safari 打开后按「分享 → 加入主画面」，之后从主画面打开；看过一次后，没有网络也能看行程和看过的照片。</div><p class="note meter hidden" id="meter"></p>

function parseTree(tree){
  var out={};
  (tree||[]).forEach(function(n){
    var m=n.type==='blob'&&/^photos\/([^\/]+)\/(refs|shots)\/([^\/]+\.(jpe?g|png|webp))$/i.exec(n.path);if(!m)return;
    var id=m[1],kind=m[2],f=m[3];var o=out[id]||(out[id]={refs:[],shots:[]});
    var src='https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/'+GH.branch+'/'+n.path.split('/').map(encodeURIComponent).join('/');
    var t=/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z/.exec(f);var at=t?(t[1]+'-'+t[2]+'-'+t[3]+'T'+t[4]+':'+t[5]+':'+t[6]+'Z'):null;
    var bm=/__([A-Za-z0-9_-]+)\.[a-z]+$/i.exec(f);o[kind].push({src:src,at:at,path:n.path,sha:n.sha,by:bm?unb64u(bm[1]):''});
  });
  Object.keys(out).forEach(function(id){['refs','shots'].forEach(function(k){out[id][k].sort(function(a,b){return a.path<b.path?-1:1;});});});
  return out;
}
function loadRemote(force){
  var cached=null;try{cached=JSON.parse(localStorage.getItem('gh-tree')||'null');}catch(e){}
  if(cached&&!force&&Date.now()-cached.t<180000){(REMOTE=parseTree(cached.tree),VOTES=parseVotes(cached.tree),parseExp(cached.tree),parsePaid(cached.tree));return Promise.resolve();}
  return ghFetch('/git/trees/'+GH.branch+'?recursive=1&_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.json();}).then(function(j){
    try{localStorage.setItem('gh-tree',JSON.stringify({t:Date.now(),tree:j.tree}));}catch(e){}
    (REMOTE=parseTree(j.tree),VOTES=parseVotes(j.tree),parseExp(j.tree),parsePaid(j.tree));return true;
  }).catch(function(){if(cached)(REMOTE=parseTree(cached.tree),VOTES=parseVotes(cached.tree),parseExp(cached.tree),parsePaid(cached.tree));return false;});
}

  show();
